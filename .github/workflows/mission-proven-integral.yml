name: MISSION_PROVEN - Integral Isolated Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mission-proven-integral.yml'
      - 'immune_gateway/**'
      - 'immune_twin/**'
      - 'tests/digital_twin/**'
      - 'scripts/validate_digital_twin.py'
      - 'scripts/final_mission_gate.py'
      - 'scripts/bootstrap_phase1.py'
      - 'tests/phase1/validate_phase1.py'

permissions:
  contents: read

concurrency:
  group: immune-mission-proven-integral
  cancel-in-progress: false

jobs:
  core-integral-proof:
    name: Core + Recovery + Digital Twin
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'

      - name: Prove default isolation before tests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gateway=json.loads(Path('config/gateway-runtime.json').read_text())
          provider=json.loads(Path('config/provider-live-test.json').read_text())
          assert gateway.get('systems') == []
          text=json.dumps(provider).lower()
          assert len(provider.get('providers', [])) == 1
          assert provider['providers'][0]['endpoint'].startswith('https://api.z.ai/')
          for forbidden in ('127.0.0.1','localhost','windows-mcp','wmcp','tunel-core','tunnel-core'):
              assert forbidden not in text, forbidden
          print('FINAL_ISOLATION_CONTRACT=true')
          PY

      - name: Compile product
        run: python -m compileall -q immune_core immune_gateway immune_lab immune_twin scripts tests

      - name: Full regression suite
        run: python -m pytest -q

      - name: Remove stale generated evidence
        shell: bash
        run: |
          rm -f evidence/phase{1..10}-validation.json evidence/digital-twin-validation.json

      - name: Rebuild Phase 1 evidence
        run: |
          python scripts/bootstrap_phase1.py
          python tests/phase1/validate_phase1.py

      - name: Revalidate Phases 2 through 10
        shell: bash
        run: |
          set -euo pipefail
          for phase in 2 3 4 5 6 7 8 9 10; do
            echo "VALIDATING_PHASE=${phase}"
            python "scripts/validate_phase${phase}.py"
          done

      - name: Revalidate closed Digital Twin
        run: python scripts/validate_digital_twin.py

      - name: Evaluate sovereign final gate
        run: python scripts/final_mission_gate.py

      - name: Record regenerated evidence digests
        shell: bash
        run: |
          {
            echo '### Regenerated evidence SHA-256'
            sha256sum evidence/phase{1..10}-validation.json evidence/digital-twin-validation.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Core proof summary
        shell: bash
        run: |
          {
            echo '## Core integral proof'
            echo '- Phase 1-10: PROVEN on this runner'
            echo '- Digital Twin: PROVEN'
            echo '- GatewayEgress + checkpoint + synthetic mutation + rollback: PROVEN'
            echo '- Protected systems attached: 0'
            echo '- External effects: 0'
            echo "- Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

  live-provider-proof:
    name: GLM Live - Isolated
    needs: core-integral-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: immune-live-test
    concurrency:
      group: immune-provider-live-smoke-isolated
      cancel-in-progress: false
    env:
      IMMUNE_PROVIDER_PRIMARY_API_KEY: ${{ secrets.GLM }}
      IMMUNE_PROVIDER_CONFIG: config/provider-live-test.json
      IMMUNE_TEST_MODE: GITHUB_ISOLATED
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prove isolated provider target
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/provider-live-test.json').read_text())
          assert len(p.get('providers', [])) == 1
          assert p['providers'][0]['endpoint'].startswith('https://api.z.ai/')
          text=json.dumps(p).lower()
          for forbidden in ('127.0.0.1','localhost','windows-mcp','wmcp','tunel-core','tunnel-core'):
              assert forbidden not in text, forbidden
          print('LIVE_PROVIDER_ISOLATION=true')
          PY

      - name: Prove secret presence without revealing it
        shell: bash
        run: |
          test -n "${IMMUNE_PROVIDER_PRIMARY_API_KEY:-}"
          echo 'LIVE_PROVIDER_SECRET_PRESENT=true'

      - name: Run GLM live smoke with bounded retry
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "PROVIDER_ATTEMPT=${attempt}"
            python scripts/provider_live_smoke.py
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo 'LIVE_PROVIDER_CONTRACT_PROVEN=true'
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$rc"
            fi
            if [ "$rc" -eq 75 ]; then
              echo 'RATE_LIMIT_RETRY=true WAIT_SECONDS=65'
              sleep 65
              continue
            fi
            if [ "$rc" -eq 76 ]; then
              echo 'TRANSIENT_PROVIDER_RETRY=true WAIT_SECONDS=20'
              sleep 20
              continue
            fi
            exit "$rc"
          done
          exit 1

      - name: Provider proof summary
        shell: bash
        run: |
          {
            echo '## Live provider proof'
            echo '- GLM API: PROVEN'
            echo '- Environment: immune-live-test'
            echo '- Target: api.z.ai only'
            echo '- Tools/execution authority exposed to model: 0'
          } >> "$GITHUB_STEP_SUMMARY"

  mission-proven:
    name: MISSION_PROVEN
    needs: [core-integral-proof, live-provider-proof]
    runs-on: ubuntu-24.04
    steps:
      - name: Emit final proof
        shell: bash
        run: |
          echo 'MISSION_PROVEN=true'
          {
            echo '# MISSION_PROVEN âœ…'
            echo ''
            echo "Commit: ${GITHUB_SHA}"
            echo 'Scope: IMMUNE_SYSTEM_V1_ISOLATED_INTEGRAL_PROOF'
            echo 'Phases 1-10: PROVEN'
            echo 'Digital Twin: PROVEN'
            echo 'GatewayEgress + checkpoint + synthetic mutation + rollback: PROVEN'
            echo 'GLM live provider: PROVEN'
            echo 'Protected systems attached during proof: 0'
            echo 'External effects on existing systems: 0'
            echo ''
            echo 'This proof validates the product in isolated controlled operation; deployment to any real protected system remains a separate authorization.'
          } >> "$GITHUB_STEP_SUMMARY"
