name: MISSION_PROVEN - Integral Isolated Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mission-proven-integral.yml'
      - '.github/workflows/brain-fortress.yml'
      - 'immune_core/**'
      - 'immune_fortress/**'
      - 'immune_vault/**'
      - 'immune_execution_broker/**'
      - 'immune_provider_proxy/**'
      - 'immune_presentation/**'
      - 'immune_control_plane/**'
      - 'immune_gateway/**'
      - 'immune_twin/**'
      - 'tests/fortress/**'
      - 'scripts/validate_brain_fortress.py'
      - 'scripts/validate_container_sandbox.py'
      - 'scripts/verify_provider_live_attestation.py'
      - 'config/provider-live-attestation.json'
      - 'BRAIN_FORTRESS_STATUS.md'
      - 'RELEASE_V1_1_STATUS.md'
      - 'tests/digital_twin/**'
      - 'scripts/validate_digital_twin.py'
      - 'scripts/final_mission_gate.py'
      - 'scripts/bootstrap_phase1.py'
      - 'tests/phase1/validate_phase1.py'
      - 'scripts/validate_phase*.py'
      - 'tests/phase*/**'
      - 'MISSION_STATUS.md'
      - 'RELEASE_V1_STATUS.md'
      - 'PHASE5_STATUS.md'
      - 'DIGITAL_TWIN_STATUS.md'

permissions:
  contents: read

concurrency:
  group: immune-mission-proven-integral
  cancel-in-progress: false

jobs:
  core-integral-proof:
    name: Core + Recovery + Digital Twin
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'

      - name: Prove default isolation before tests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gateway=json.loads(Path('config/gateway-runtime.json').read_text())
          provider=json.loads(Path('config/provider-live-test.json').read_text())
          assert gateway.get('systems') == []
          text=json.dumps(provider).lower()
          assert len(provider.get('providers', [])) == 1
          assert provider['providers'][0]['endpoint'].startswith('https://api.z.ai/')
          for forbidden in ('127.0.0.1','localhost','windows-mcp','wmcp','tunel-core','tunnel-core'):
              assert forbidden not in text, forbidden
          print('FINAL_ISOLATION_CONTRACT=true')
          PY

      - name: Compile product
        run: python -m compileall -q immune_core immune_fortress immune_vault immune_execution_broker immune_provider_proxy immune_presentation immune_control_plane immune_gateway immune_lab immune_twin scripts tests

      - name: Full regression suite
        run: python -m pytest -q

      - name: Remove stale generated evidence
        shell: bash
        run: |
          rm -f evidence/phase{1..10}-validation.json evidence/digital-twin-validation.json

      - name: Rebuild Phase 1 evidence
        run: |
          python scripts/bootstrap_phase1.py
          python tests/phase1/validate_phase1.py

      - name: Revalidate Phases 2 through 10
        shell: bash
        run: |
          set -euo pipefail
          for phase in 2 3 4 5 6 7 8 9 10; do
            echo "VALIDATING_PHASE=${phase}"
            python "scripts/validate_phase${phase}.py"
          done

      - name: Revalidate closed Digital Twin
        run: python scripts/validate_digital_twin.py

      - name: Prove disposable Worker and Adapter OS sandbox
        shell: bash
        run: |
          set -euo pipefail
          docker version
          build_dir="$RUNNER_TEMP/immune-sandbox-build"
          mkdir -p "$build_dir"
          gcc -O2 -static tests/fortress/sandbox_probe.c -o "$build_dir/probe"
          cat > "$build_dir/Dockerfile" <<'EOF'
          FROM scratch
          COPY probe /probe
          ENTRYPOINT ["/probe"]
          EOF
          image="immune-sandbox-probe:${GITHUB_SHA}"
          trap 'docker image rm --force "$image" >/dev/null 2>&1 || true' EXIT
          docker build --network none -t "$image" "$build_dir"
          python scripts/validate_container_sandbox.py --image "$image"
          echo 'IMMUNE_DISPOSABLE_SANDBOX_PROVEN=true' >> "$GITHUB_ENV"
          echo 'DISPOSABLE_WORKER_ADAPTER_OS_SANDBOX_PROVEN=true'

      - name: Revalidate seven-ring Brain Fortress when present
        run: python scripts/validate_brain_fortress.py

      - name: Evaluate sovereign final gate
        run: python scripts/final_mission_gate.py

      - name: Record regenerated evidence digests
        shell: bash
        run: |
          {
            echo '### Regenerated evidence SHA-256'
            sha256sum evidence/phase{1..10}-validation.json evidence/digital-twin-validation.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Core proof summary
        shell: bash
        run: |
          {
            echo '## Core integral proof'
            echo '- Phase 1-10: PROVEN on this runner'
            echo '- Digital Twin: PROVEN'
            echo '- GatewayEgress + checkpoint + synthetic mutation + rollback: PROVEN'
            echo '- Protected systems attached: 0'
            echo '- External effects: 0'
            echo "- Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

  provider-proof-mode:
    name: Provider Proof Attestation
    needs: core-integral-proof
    runs-on: ubuntu-24.04
    outputs:
      reuse: ${{ steps.attestation.outputs.reuse }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Fetch immutable live-proof baseline
        shell: bash
        run: |
          set -euo pipefail
          base=$(python -c "import json; print(json.load(open('config/provider-live-attestation.json'))['baseline_commit'])")
          git fetch --no-tags --depth=1 origin "$base"

      - name: Verify external live-provider attestation and surface identity
        id: attestation
        run: python scripts/verify_provider_live_attestation.py

  live-provider-proof:
    name: GLM Live - Isolated
    needs: [core-integral-proof, provider-proof-mode]
    if: ${{ needs.provider-proof-mode.result == 'success' && needs.provider-proof-mode.outputs.reuse != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: immune-live-test
    concurrency:
      group: immune-provider-live-smoke-isolated
      cancel-in-progress: false
    env:
      IMMUNE_PROVIDER_PRIMARY_API_KEY: ${{ secrets.GLM }}
      IMMUNE_PROVIDER_CONFIG: config/provider-live-test.json
      IMMUNE_TEST_MODE: GITHUB_ISOLATED
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prove isolated provider target
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/provider-live-test.json').read_text())
          assert len(p.get('providers', [])) == 1
          assert p['providers'][0]['endpoint'].startswith('https://api.z.ai/')
          text=json.dumps(p).lower()
          for forbidden in ('127.0.0.1','localhost','windows-mcp','wmcp','tunel-core','tunnel-core'):
              assert forbidden not in text, forbidden
          print('LIVE_PROVIDER_ISOLATION=true')
          PY

      - name: Prove secret presence without revealing it
        shell: bash
        run: |
          test -n "${IMMUNE_PROVIDER_PRIMARY_API_KEY:-}"
          echo 'LIVE_PROVIDER_SECRET_PRESENT=true'

      - name: Run GLM live smoke with bounded retry
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3 4; do
            echo "PROVIDER_ATTEMPT=${attempt}"
            python scripts/provider_live_smoke.py
            rc=$?
            if [ "$rc" -eq 0 ]; then echo 'LIVE_PROVIDER_CONTRACT_PROVEN=true'; exit 0; fi
            if [ "$attempt" -eq 4 ]; then exit "$rc"; fi
            if [ "$rc" -eq 75 ]; then wait_seconds=$((attempt * 90)); echo "RATE_LIMIT_RETRY=true WAIT_SECONDS=${wait_seconds}"; sleep "$wait_seconds"; continue; fi
            if [ "$rc" -eq 76 ]; then wait_seconds=$((attempt * 30)); echo "TRANSIENT_PROVIDER_RETRY=true WAIT_SECONDS=${wait_seconds}"; sleep "$wait_seconds"; continue; fi
            exit "$rc"
          done
          exit 1

  provider-proof:
    name: Provider Proof Accepted
    if: ${{ always() }}
    needs: [provider-proof-mode, live-provider-proof]
    runs-on: ubuntu-24.04
    env:
      MODE_RESULT: ${{ needs.provider-proof-mode.result }}
      REUSE: ${{ needs.provider-proof-mode.outputs.reuse }}
      LIVE_RESULT: ${{ needs.live-provider-proof.result }}
    steps:
      - name: Accept immutable attestation or fresh live proof
        shell: bash
        run: |
          set -euo pipefail
          test "$MODE_RESULT" = 'success'
          if [ "$REUSE" = 'true' ]; then
            test "$LIVE_RESULT" = 'skipped'
            echo 'PROVIDER_PROOF=IMMUTABLE_LIVE_ATTESTATION_REUSED'
          else
            test "$LIVE_RESULT" = 'success'
            echo 'PROVIDER_PROOF=FRESH_LIVE_PROVIDER'
          fi

  mission-proven:
    name: MISSION_PROVEN
    needs: [core-integral-proof, provider-proof]
    runs-on: ubuntu-24.04
    steps:
      - name: Emit final proof
        shell: bash
        run: |
          echo 'MISSION_PROVEN=true'
          {
            echo '# MISSION_PROVEN'
            echo ''
            echo "Commit: ${GITHUB_SHA}"
            echo 'Scope: IMMUNE_SYSTEM_V1_ISOLATED_INTEGRAL_PROOF'
            echo 'Phases 1-10: PROVEN'
            echo 'Digital Twin: PROVEN'
            echo 'GatewayEgress + checkpoint + synthetic mutation + rollback: PROVEN'
            echo 'Provider proof: fresh live or externally verified immutable live attestation'
            echo 'Protected systems attached during proof: 0'
            echo 'External effects on existing systems: 0'
            echo ''
            echo 'This proof validates the product in isolated controlled operation; deployment to any real protected system remains a separate authorization.'
          } >> "$GITHUB_STEP_SUMMARY"
