name: Phase 4 - Cognition and skills

on:
  push:
    branches:
      - phase/4-cognition-skills
    paths:
      - immune_core/providers.py
      - immune_core/memory.py
      - immune_core/skills.py
      - immune_core/cognition.py
      - tests/phase4/**
      - scripts/validate_phase4.py
      - adr/ADR-0004-cognition-skills.md
      - .github/workflows/phase4-cognition.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove-phase4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: phase/4-cognition-skills
          fetch-depth: 0

      - name: Verify sovereign baselines
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE1_PROVEN' PHASE1_STATUS.md
          grep -q 'PHASE2_PROVEN' PHASE2_STATUS.md
          grep -q 'PHASE3_PROVEN' PHASE3_STATUS.md

      - name: Compile cognition foundation
        run: python -m compileall -q immune_core immune_lab scripts/validate_phase4.py tests/phase4

      - name: Run Phase 2 regression tests
        run: python -m unittest discover -s tests/phase2 -p 'test_*.py' -v

      - name: Run Phase 3 regression tests
        run: python -m unittest discover -s tests/phase3 -p 'test_*.py' -v

      - name: Run Phase 4 cognition and skills tests
        run: python -m unittest discover -s tests/phase4 -p 'test_*.py' -v

      - name: Run deterministic Phase 4 proof
        run: python scripts/validate_phase4.py

      - name: Verify no nested upstream Git metadata
        shell: bash
        run: |
          set -euo pipefail
          if find immune_core immune_lab tests/phase4 scripts adr -mindepth 1 -name .git -print -quit | grep -q .; then
            echo 'Nested upstream .git metadata detected'
            exit 1
          fi

      - name: Commit Phase 4 proof evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/phase4-validation.json PHASE4_STATUS.md
          if git diff --cached --quiet; then
            echo 'No Phase 4 evidence changes.'
          else
            git commit -m 'feat(phase4): record proven cognition and skills'
            git push origin HEAD:phase/4-cognition-skills
          fi
