name: Phase 7 - Operational experience

on:
  push:
    branches:
      - phase/7-operational-experience
    paths:
      - immune_core/operations.py
      - immune_core/panel.py
      - immune_core/cli.py
      - immune_core/runbooks.py
      - tests/phase7/**
      - scripts/validate_phase7.py
      - runbooks/default.json
      - adr/ADR-0007-operational-experience.md
      - .github/workflows/phase7-operations.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove-phase7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: phase/7-operational-experience
          fetch-depth: 0

      - name: Verify sovereign baselines
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5 6; do
            grep -q "PHASE${n}_PROVEN" "PHASE${n}_STATUS.md"
          done

      - name: Compile operational experience
        run: python -m compileall -q immune_core scripts/validate_phase7.py tests/phase7

      - name: Run Phase 2 regression tests
        run: python -m unittest discover -s tests/phase2 -p 'test_*.py' -v

      - name: Run Phase 3 regression tests
        run: python -m unittest discover -s tests/phase3 -p 'test_*.py' -v

      - name: Run Phase 4 regression tests
        run: python -m unittest discover -s tests/phase4 -p 'test_*.py' -v

      - name: Run Phase 5 regression tests
        run: python -m unittest discover -s tests/phase5 -p 'test_*.py' -v

      - name: Run Phase 6 regression tests
        run: python -m unittest discover -s tests/phase6 -p 'test_*.py' -v

      - name: Run Phase 7 operational tests
        run: python -m unittest discover -s tests/phase7 -p 'test_*.py' -v

      - name: Run deterministic Phase 7 proof
        run: python scripts/validate_phase7.py

      - name: Verify no nested upstream Git metadata
        shell: bash
        run: |
          set -euo pipefail
          if find immune_core tests/phase7 scripts runbooks adr -mindepth 1 -name .git -print -quit | grep -q .; then
            echo 'Nested upstream .git metadata detected'
            exit 1
          fi

      - name: Commit Phase 7 proof evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/phase7-validation.json PHASE7_STATUS.md
          if git diff --cached --quiet; then
            echo 'No Phase 7 evidence changes.'
          else
            git commit -m 'feat(phase7): record proven operational experience'
            git push origin HEAD:phase/7-operational-experience
          fi
