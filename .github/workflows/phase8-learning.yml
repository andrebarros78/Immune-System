name: Phase 8 - Controlled learning

on:
  push:
    branches:
      - phase/8-controlled-learning
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove-phase8:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: phase/8-controlled-learning
          fetch-depth: 0

      - name: Verify sovereign baselines
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5 6 7; do
            grep -q "PHASE${n}_PROVEN" "PHASE${n}_STATUS.md"
          done

      - name: Compile controlled learning
        run: python -m compileall -q immune_core scripts/validate_phase8.py tests/phase8

      - name: Run Phase 2 regression tests
        run: python -m unittest discover -s tests/phase2 -p 'test_*.py' -v

      - name: Run Phase 3 regression tests
        run: python -m unittest discover -s tests/phase3 -p 'test_*.py' -v

      - name: Run Phase 4 regression tests
        run: python -m unittest discover -s tests/phase4 -p 'test_*.py' -v

      - name: Run Phase 5 regression tests
        run: python -m unittest discover -s tests/phase5 -p 'test_*.py' -v

      - name: Run Phase 6 regression tests
        run: python -m unittest discover -s tests/phase6 -p 'test_*.py' -v

      - name: Run Phase 7 regression tests
        run: python -m unittest discover -s tests/phase7 -p 'test_*.py' -v

      - name: Run Phase 8 controlled learning tests
        run: python -m unittest discover -s tests/phase8 -p 'test_*.py' -v

      - name: Run deterministic Phase 8 proof
        run: python scripts/validate_phase8.py

      - name: Verify no nested upstream Git metadata
        shell: bash
        run: |
          set -euo pipefail
          if find . -mindepth 2 -type d -name .git -print -quit | grep -q .; then
            echo 'Nested .git metadata found'
            exit 1
          fi

      - name: Commit Phase 8 proof evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE8_STATUS.md evidence/phase8-validation.json
          if git diff --cached --quiet; then
            echo 'No Phase 8 evidence changes'
            exit 0
          fi
          git commit -m 'feat(phase8): record proven controlled learning'
          git push origin HEAD:phase/8-controlled-learning
